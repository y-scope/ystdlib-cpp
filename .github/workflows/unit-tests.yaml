name: "unit-tests"

on:
  pull_request:
  push:
  schedule:
    # Run daily at 00:15 UTC (the 15 is to avoid periods of high load)
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"

  # Cancel in-progress jobs for efficiency
  cancel-in-progress: true

jobs:
  build-ystdlib-cpp:
    strategy:
      matrix:
        os:
          - "macos-14"
          - "macos-15"
          - "ubuntu-22.04"
          - "ubuntu-24.04"
        build_type:
          - "debug"
          - "release"
    runs-on: "${{matrix.os}}"
    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"  # v6.0.2
        with:
          submodules: "recursive"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-python"
        with:
          version: "3.11"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"

      - name: "Run unit tests and examples"

        # Currently unit tests rely on cassert and fail to compile in release mode.
        run: |-
          task test:run-debug
          task examples:build-${{matrix.build_type}}
          ./build/examples/${{matrix.build_type}}/linking-tests
